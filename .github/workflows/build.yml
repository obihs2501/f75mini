name: Build and test Windows

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-x64:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Configure x64
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64
      - name: Compile with MSVC
        run: cmake --build build --config Release --parallel
      - name: Test without hardware
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Check embedded desktop manifest
        run: |
          $sdk = Join-Path ${env:ProgramFiles(x86)} 'Windows Kits/10/bin'
          $mt = Get-ChildItem "$sdk/*/x64/mt.exe" | Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $mt) { throw 'Windows SDK manifest tool not found' }
          & $mt.FullName -nologo '-inputresource:build/Release/F75Config.exe;#1' '-out:build/embedded.manifest'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $manifest = Get-Content -Raw -LiteralPath build/embedded.manifest
          if ($manifest -notmatch 'PerMonitorV2' -or $manifest -notmatch 'Microsoft\.Windows\.Common-Controls') {
            throw 'Expected DPI awareness and Common Controls v6 dependency'
          }
      - name: Collect portable package
        run: cmake --install build --config Release --prefix dist
      - name: Record executable sizes and SHA-256
        run: |
          $rows = Get-ChildItem dist -Filter *.exe | Sort-Object Name | ForEach-Object {
            $hash = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.Name)"
          }
          $rows | Set-Content -Encoding ascii dist/SHA256SUMS.txt
          '### Windows x64 package' >> $env:GITHUB_STEP_SUMMARY
          '| File | Bytes |' >> $env:GITHUB_STEP_SUMMARY
          '| --- | ---: |' >> $env:GITHUB_STEP_SUMMARY
          Get-ChildItem dist -Filter *.exe | Sort-Object Name | ForEach-Object {
            "| $($_.Name) | $($_.Length) |" >> $env:GITHUB_STEP_SUMMARY
          }
      - name: Upload Windows x64 package
        uses: actions/upload-artifact@v4
        with:
          name: f75-windows-x64
          path: dist/
          if-no-files-found: error
          retention-days: 90
